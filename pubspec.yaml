name: mono_pickers
description: 31 animated, monochrome Flutter pickers for fitness, shopping, checkout, travel, tickets, booking, smart home, feedback and habit apps. Rulers, drums, dials, calendars, seats and more.
version: 0.1.0
homepage: https://github.com/stacxiq/mono_pickers
repository: https://github.com/stacxiq/mono_pickers
issue_tracker: https://github.com/stacxiq/mono_pickers/issues
screenshots:
  - description: Fitness pickers - ruler, stadiometer, drum and body-fat silhouette (dark).
    path: doc/fitness.jpg
  - description: Shopping and checkout pickers (light).
    path: doc/shopping.jpg
  - description: Travel pickers - route swap, range calendar and guest counters (dark).
    path: doc/travel.jpg
topics: [picker, slider, ui, animation, widget]

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

